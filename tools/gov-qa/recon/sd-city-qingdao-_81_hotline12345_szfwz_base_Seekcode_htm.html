    <script type="text/javascript">        //倒计时
        function htmlScroll() {
            return;
            var elFix = document.getElementById('div21');
            var top = document.body.scrollTop || document.documentElement.scrollTop;
            if (elFix.data_top < top) {
                elFix.style.position = 'fixed';
                elFix.style.top = 0;
                elFix.style.left = elFix.data_left;
            }
            else {
                elFix.style.position = 'static';
            }
        }

        function htmlPosition(obj) {
            var o = obj;
            var t = o.offsetTop;
            var l = o.offsetLeft;
            while (o = o.offsetParent) {
                t += o.offsetTop;
                l += o.offsetLeft;
            }
            obj.data_top = t;
            obj.data_left = l;
        }

        var oldHtmlWidth = document.documentElement.offsetWidth;
        window.onresize = function () {
            var newHtmlWidth = document.documentElement.offsetWidth;
            if (oldHtmlWidth == newHtmlWidth) {
                return;
            }
            oldHtmlWidth = newHtmlWidth;
            elFix.style.position = 'static';
            htmlPosition(elFix);
            htmlScroll();
        }
        window.onscroll = htmlScroll;
        $(document).ready(function () {
            var elFix = document.getElementById('div21');

            htmlPosition(elFix);

            var date = new Date();
            date.getYear(); //获取当前年份(2位) 
            date.getFullYear(); //获取完整的年份(4位,2014) 
            date.getMonth(); //获取当前月份(0-11,0代表1月) 
            date.getDate(); //获取当前日(1-31) 
            date.getDay(); //获取当前星期X(0-6,0代表星期天) 
            date.getTime(); //获取当前时间(从1970.1.1开始的毫秒数) 
            date.getHours(); //获取当前小时数(0-23) 
            date.getMinutes(); //获取当前分钟数(0-59) 
            date.getSeconds(); //获取当前秒数(0-59) 
            date.getMilliseconds(); //获取当前毫秒数(0-999) 
            date.toLocaleDateString(); //获取当前日期 如 2014年6月25日 
            date.toLocaleTimeString(); //获取当前时间 如 下午4:45:06 
            date.toLocaleString(); //获取日期与时间 如 2014年6月25日 下午4:45:06
        });
        // 获取当前日期时间
        function getDatetime() {
            var now = new Date();
            var year = now.getFullYear();
            var month = now.getMonth() + 1;
            var day = now.getDate();
            var hh = now.getHours();
            var mm = now.getMinutes();
            var ss = now.getSeconds();
            var clock = year + "-";
            if (month < 10)
                clock += "0";
            clock += month + "-";
            if (day < 10)
                clock += "0";
            clock += day + " ";
            if (hh < 10)
                clock += "0";
            clock += hh + ":";
            if (mm < 10) clock += '0';
            clock += mm + ":";
            if (ss < 10) clock += '0';
            clock += ss;
            return clock;
        }
        // 获取当前日期时间
        function timestampToTime(timestamp) {
            var date = new Date(timestamp);
            var Y = date.getFullYear() + '-';
            var M = (date.getMonth() + 1 < 10 ? '0' + (date.getMonth() + 1) : date.getMonth() + 1) + '-';
            var D = date.getDate() < 10 ? '0' + date.getDate() : date.getDate() + ' ';
            var hh = date.getHours() < 10 ? '0' + date.getHours() : date.getHours() + ':';
            var mm = date.getMinutes() < 10 ? '0' + date.getMinutes() : date.getMinutes() + ':';
            var ss = date.getSeconds() < 10 ? '0' + date.getDate() : date.getSeconds();
            return Y + M + D + hh + mm + ss;
        }
    </script>
