		<script>
				var isPc = true;
				function IsPC() {
					  var userAgentInfo = navigator.userAgent;
					  var Agents = ["Android", "iPhone",
							"SymbianOS", "Windows Phone",
							"iPad", "iPod"];
					  var flag = true;
					  for (var v = 0; v < Agents.length; v++) {
						if (userAgentInfo.indexOf(Agents[v]) > 0) {
						  flag = false;
						  break;
						}
					  }
					  isPc  = flag;
				}
				$(document).ready(function(){
					IsPC();

						var winPos = $(window).scrollTop();
						//console.log(winPos);
						if(winPos > 160 ){

							$("#toper_2").hide();
						}else{
							if(isPc)$("#toper_1").show();
							$("#toper_2").show();
						}

				});
				
				function checkUtl(){
						var search_value = document.getElementById("qt").value;
						
						if (search_value.replace(/(^s*)|(s*$)/g, "").length ==0){ 
							// alert('检索词为空...');
							form.action="https://zs.mot.gov.cn/mot/s";			
						}else{
							form.action="https://zs.mot.gov.cn/mot/s";			 
						}
						
						return true;
					
					}
					
					function checkUtl_form_mibile(){
											var search_value = document.getElementById("qt_phone").value;
											
											if (search_value.replace(/(^s*)|(s*$)/g, "").length ==0){

											}else{

											}											
											return true;
										
										}

					function toMy(){

					}

		<script type="text/javascript">
			var pageSize = 10; 
			$(document).ready(function(){
				showAllByPage(1);
			});
			
			
			function showAllByPage(pageNo){
					var KEYWORDS =$("#KEYWORDS").val();
					KEYWORDS = $.trim(KEYWORDS);
					if(KEYWORDS.endWith("QA") && KEYWORDS.length == 15){
						window.location.href = "/mapplys/pub/visitor/userIndex/questionDetail?id="+KEYWORDS;
					}else{
						$.ajax({
					        type: "post",
					        url: contentp_path+"/pub/visitor/userIndex/getUserByLeavingMessage",
					        data: {pageNo:pageNo,pageSize:pageSize,TITLE:KEYWORDS,KEYWORDS:KEYWORDS,RANDOMSTR:KEYWORDS,MOBILE:KEYWORDS,orderByFiled:'CRTIME'},
					        dataType: "json",
					        success: function (result) {
					        	 var pages = result.pages;
	           					 var pageNo = result.pageNo;
					            var tr = "";
					            var title = "";
					            for (i = 0; i <  result.datas.length; i++) {
					                var date_curr = new Date();  
					                date_curr.setTime(result.datas[i].CRTIME);
					                console.info(result.datas[i].CRTIME);
					                var crtimes = date_curr.format('yyyy-MM-dd');
					                title = result.datas[i].TITLE;
					                tr += "<li class=\"fl w100\">"+
											"<div class=\"fl col-md-10 col-sm-9 col-xs-8 paddnone\">"+
											"	<a href=\"/mapplys/pub/visitor/userIndex/questionDetail?id="+result.datas[i].QUESTIONID+"\" class=\"fl\" target=\"_blank\" title=\""+delHtmlTag(title)+"\">"+title+"</a>"+
											"</div>"+
											"<div class=\"fr col-md-2 col-sm-3 col-xs-4 paddnone grlb_list_btn text-right\">"+crtimes+
											"</div>"+
										"</li>";
					            }
					            if(tr != ''){
					            	$("#datas").html(tr);
					            	frontGeneratorPage(pageNo,pages,'pages');
					            }else{
					            	tr = "<li class=\"fl w100\" style=\"border-bottom: none;\">"+
										"	<div class=\"fl col-md-10 col-sm-9 col-xs-8 paddnone\">"+
										"		<a href=\"javascript:void(0);return false;\" class=\"fl\" id=\"lsult\">暂无数据</a>"+
										"	</div>"+
										"</li>";
									$("#datas").html(tr);
									$("#pages").html('');
					            }
					        }
					    });
				    }
			}
			
			function info(questionId){
			    var url_open = contentp_path+"/pub/visitor/userIndex/questionDetail?id="+questionId; 
				window.open(url_open);
			}
			
		</script>
