<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="x-ua-compatible"
    content="ie=edge,chrome=1"
  >
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  />
  <link
    rel="stylesheet"
    href="./assets/css/commen.css"
  >
  <script src="./assets/jquery-1.9.1.min.js"></script>
  <script src="./assets/toast.js"></script>
  <script src="./assets/api/api.js"></script>
  <title>交流公开</title>
<link href="./css/exchangeOpen.b03af254.min.css" rel="stylesheet"></head>
<body>
  <div class="exchange-content">
    <ul id="handle-Statistics-list">

    </ul>
  </div>
  <div id="page"></div>
  <script type="text/javascript">
    $(document).ready(function () {
      initData()
    })
    function initData(nowpage) {
      var data = {
        page: nowpage ? Number(nowpage) : 1,
        size: 15,
      }
      api.exchangeOpen(data, success, fail)
      function success(resp) {
        if (resp.code === 20000) {
          if (resp.data.totalRows > 15) {
            setPage(data.page, resp.data.totalRows)
            $(".exchange-content").css("height", "650px")
          }
          else {
          }
          infoList(resp.data.items)
        } else {
          showAlert(resp.message)
        }
      }
      function fail(resp) {

      }

    }
    function infoList(data) {
      $("#handle-Statistics-list").html('')
      var html = ''
      var url = './openDetail.html?id='
      if (data.length) {
        $.each(data, function (key, item) {
          html +=
            '<li class="item">' +
            '<a href=' + url + item.id + ' class="item-left">' + item.title + '</a>' +
            '<span class="item-right">' + item.createTime.substring(0, 10) + '</span>' +
            '</li>'
        })
      }
      $("#handle-Statistics-list").append(html)
    }
    function setPage(nowpage, totalCount) {     //nowpage:当前页数  totalCount：数据总条数
      var pageSize = Math.ceil(totalCount / 15);    //总页数
      var showSize = Math.ceil(totalCount / 15) < 5 ? Math.ceil(totalCount / 15) : 5;  //显示的页数
      var maxPage = pageSize;
      var oldPage = 1;
      if (showSize <= pageSize) {
        maxPage = showSize;
      }
      if (nowpage > pageSize) {
        nowpage = pageSize;
      }
      if (nowpage < 1) {
        nowpage = 1;
      }
      $("#page").html('')
      $("#page").append('<ul><li style="width:40px;">首页</li><li><</li>');
      if (nowpage > Math.ceil(showSize / 2)) {
        if (nowpage <= pageSize - 2 && nowpage >= 3) {
          for (var i = nowpage - 2; i <= eval(nowpage + "+2"); i++) {
            if (i == nowpage) {
              $("#page ul").append('<li class="active">' + i + '</li>');
            }
            else {
              $("#page ul").append('<li>' + i + '</li>');
            }
          }
        }
        else if (nowpage == pageSize - 1) {
          for (var i = nowpage - 3; i <= eval(nowpage + "+1"); i++) {
            if (i == nowpage) {
              $("#page ul").append('<li class="active">' + i + '</li>');
            }
            else {
              $("#page ul").append('<li>' + i + '</li>');
            }
          }
        }
        else {
          for (var i = (nowpage - 4) < 1 ? 1 : nowpage - 4; i <= nowpage; i++) {
            if (i == nowpage) {
              $("#page ul").append('<li class="active">' + i + '</li>');
            }
            else {
              $("#page ul").append('<li>' + i + '</li>');
            }
          }
        }
      }
      else {
        for (var i = 1; i <= showSize; i++) {
          if (i == nowpage) {
            $("#page ul").append('<li class="active">' + i + '</li>');
          }
          else {
            $("#page ul").append('<li>' + i + '</li>');
          }
        }
      }
      oldPage = nowpage;
      $("#page ul").append('<li>></li></li><li style="width:40px;">末页</li></ul>')
      $("#page ul li").click(function () {
        nowpage = $(this).text();

        if ($(this).text() == "首页") {
          $("#page").empty()
          setPage(1, totalCount);
          $(this).siblings("li").removeClass("active");
        }
        else if ($(this).text() == "末页") {
          $("#page").empty()
          setPage(pageSize, totalCount);
          $(this).siblings("li").removeClass("active");
        }
        else if ($(this).text() == "<") {
          $("#page").empty()
          setPage(Math.ceil(oldPage - 1), totalCount);
          $(this).siblings("li").removeClass("active");
        }
        else if ($(this).text() == ">") {
          $("#page").empty()
          setPage(Math.ceil(oldPage + 1), totalCount);
          $(this).siblings("li").removeClass("active");
        }
        else if (showSize >= pageSize) {
          $(this).attr("class", "active");
          $(this).siblings("li").removeClass("active");
        }
        else if ($(this).text() <= Math.ceil(showSize / 2)) {
          $(this).attr("class", "active");
          $(this).siblings("li").removeClass("active");
        }
        else {
          $("#page").empty()
          setPage($(this).text(), totalCount);
          $(this).siblings("li").removeClass("active");
        }
        if (nowpage === '>') {
          nowpage = oldPage + 1 > pageSize ? pageSize : oldPage + 1
        } else if (nowpage === '<') {
          nowpage = oldPage - 1 < 1 ? 1 : oldPage - 1
        } else if (nowpage === '首页') {
          nowpage = 1
        } else if (nowpage === '末页') {
          nowpage = pageSize
        }
        initData(nowpage)
      })
    }
  </script>

<script type="text/javascript" src="././js/exchangeOpen.16574dd3.js"></script></body>
</html>
