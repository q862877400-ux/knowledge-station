	<script src="/ac_gzcy_app/ajax/libs/bootstrap-table/extensions/custom-view/bootstrap-table-custom-view.js?v=1.18.3"></script>

    <script>
        var prefix = ctx + "gzwd";
        $(function() {
            var options = {
                url: prefix + "/commonQuestionlist",
		        showSearch: false,
		        showRefresh: false,
		        showToggle: false,
		        showColumns: false,
		        showExport: true,
                columns: [
				{
					field : 'content', 
					title : '内容'
				},
				{
					field : 'answerinfoTotal', 
					title : '答复'
				}]
            };
            $.table.init(options);
        });
        
        function customViewFormatter (data) {
            var template = $('#profileTemplate').html()
            var view = ''
            $.each(data, function (i, row) {
              view += template.replace('%content%', row.content)
                .replace('%answerinfoTotal%', row.answerinfoTotal);
            })
            return `${view}`
          }
    </script>
