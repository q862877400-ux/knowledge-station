        function submitInfo() {
            var currPage = getCookie("dxal_list_curr");
            layui.use('table', function () {
                var table = layui.table;
                var tableWidth = $('#form1').width();
                table.render({
                    elem: '#test'
                    , url: 'CommonHandler.ashx'
                    //, height: 430
                    , response: {
                        statusName: 'code' //规定数据状态的字段名称，默认：code
                        , statusCode: 200 //规定成功的状态码，默认：0
                        , msgName: 'msg' //规定状态信息的字段名称，默认：msg
                        , countName: 'count' //规定数据总数的字段名称，默认：count
                        , dataName: 'data' //规定数据列表的字段名称，默认：data
                        , curr: 1                        //起始页
                    }
                    , page: { //支持传入 laypage 组件的所有参数（某些参数除外，如：jump/elem） - 详见文档
                        layout: ['limit', 'count', 'prev', 'page', 'next', 'skip'] //自定义分页布局
                        , curr: currPage //设定初始在第 5 页
                        , limit: 20
                        , limits: [20, 30, 40, 50]
                        , groups: 5

                    }
                    , where: {
                        opreate: "szf_wz_base_list"
                    }
                    , cellMinWidth: 80 //全局定义常规单元格的最小宽度，layui 2.2.1 新增
                    , cols: [[ //表头
                          {field: 'id', title: '业务单号', sort: true, fixed: 'left', hide: true }
                          //, { field: 'title', title: '标题', width: tableWidth * 0.35 }
                          , { field: 'content', title: '问题描述', width: '65%', sort: true }
                          , { field: 'ReplayUnit', title: '办理单位', width: '25%' }
                          , { field: 'sendtime', title: '诉求时间', width: '10%' }
                        ]]
                    , even: true //开启隔行背景
                    , done: function (res, curr, count) {
                        //如果是异步请求数据方式，res即为你接口返回的信息。
                        //如果是直接赋值的方式，res即为：{data: [], count: 99} data为当前页数据、count为数据总长度
                        console.log(res);

                        //得到当前页码
                        setCookie("dxal_list_curr", curr, 1);
                        console.log(curr);
                        var that = this.elem.next();
                        res.data.forEach(function (item, index) {
                            if (index % 2 == 0) {
                                var tr = that.find(".layui-table-box tbody tr[data-index='" + index + "']").css("background-color", "#ffffff");
                            } else {
                                var tr = that.find(".layui-table-box tbody tr[data-index='" + index + "']").css("background-color", "#f4f9fd");
                            }
                        })

                        //$(".layui-table th").css("font-weight", "bold"); // 设定表格标题字体加粗
                        $('th').css({ 'background-color': '#5792c6', 'color': '#fff', 'font-weight': 'bold' });
                        //得到数据总量
                        console.log(count);
                        //alert(count);
                        //$('td').css({ 'color': '#fff' })
                        //Layui_SetDataTableRowColor('test', 0, '#2c08b1');
                    }


                });
                //监听行单击事件（单击事件为：rowDouble）
                table.on('row(test)', function (obj) {
                    //console.log(obj.tr) //得到当前行元素对象
                    //console.log(obj.data) //得到当前行数据
                    var data = obj.data;
                    window.location.assign("DxalView.aspx?id=" + data.id + "");
                    //                layer.alert(JSON.stringify(data), {
                    //                    title: '当前行数据：'
                    //                });

                    //标注选中样式
                    //obj.tr.addClass('layui-table-click').siblings().removeClass('layui-table-click');
                });
            });

        }

        function getCookie(cname) {
            var name = cname + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i].trim();
                if (c.indexOf(name) == 0) { return c.substring(name.length, c.length); }
            }
            return "";
        }

        //模拟渲染
        var render = function (data, curr) {
            var arr = []
                            , thisData = data.concat().splice(curr * nums - nums, nums);
            layui.each(thisData, function (index, item) {
                arr.push('<li>' + item + '</li>');
            });
            return arr.join('');
        };

        //设置layui datatable的某一行的颜色
        //TabDivId:tab父div id;RowIndex:行序列号，从0开始；ColorString：颜色字符串，如'#123456'
        function Layui_SetDataTableRowColor(TabDivId, RowIndex, ColorString) {
            try {
                var div = document.getElementById(TabDivId);
                if (div != null) //找到对象了
                {
                    var table_main = div.getElementsByClassName('layui-table-main');   //通过class获取table_main
                    if (table_main != null && table_main.length > 0) {
                        var table = table_main[0].getElementsByClassName('layui-table');   //通过class获取table
                        if (table != null && table.length > 0) {
                            var trs = table[0].querySelectorAll("tr");
                            if (trs != null && trs.length > 0) {
                                trs[RowIndex].style.color = ColorString;
                            }
                        }
                    }
                }
            }
            catch (e) {
                console.log(e.message);
            }
        }

        function rightToggle() {
            var t = $('#xfc').css("display") == "none" ? "点击收起" : "点击展开";
            $("#toggleA").text(t);
            $('#xfc').toggle();
        }

        function gotoTop() {
            document.body.scrollTop = document.documentElement.scrollTop = 0;
        }

    <script type="text/javascript">
        $(document).ready(function () {
            //获取当前时间
            var date = new Date();
            var year = date.getFullYear();    //  返回的是年份
            var month = date.getMonth() + 1;  //  返回的月份上个月的月份，记得+1才是当月
            var dates = date.getDate();       //  返回的是几号
            var day = date.getDay();          //  周一返回的是1，周六是6，但是周日是0
            var arr = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六", ];
            //2022年5月27日 星期五
            $("#curDate").html(year + "年" + month + "月" + dates + "日 " + arr[day]);

            var userName = $("#loginUser").val();
            if (userName != "") {
                $("#userNameDiv").show().find("a").text(userName);
                $("#logoutDiv").show();
                $("#historySqDiv").show();
                $("#loginDiv").hide();
                $("#registerDiv").hide();
            } else {
                $("#userNameDiv").hide().find("a").text("");
                $("#logoutDiv").hide();
                $("#historySqDiv").hide();
                $("#loginDiv").show();
                $("#registerDiv").show();
                checkLogin();
            }
        });
        //获取
        function getQueryString(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]);
            return null;
        }

        //验证登录，如果有token=XXXXXXXX&proxyapp=XXXXXXXX 且没有登录信息，则调取接口获取用户信息
        function checkLogin() {
            var token = getQueryString("token");
            var proxyapp = getQueryString("proxyapp");
            if (token != null && proxyapp != null
               && token != '' && proxyapp != '') {
                //从后台直接调用接口获取用户信息

                //获取数据
                $.post("szfwz/CommonHandler.ashx",
			        { opreate: 'szf_wz_getUserInfo',
			            token: token,
			            proxyapp: proxyapp
			        },
                    function (ret) {
                        var data = eval('(' + ret + ')');
                        if (data.success) {
                            $("#userNameDiv").show().find("a").text(data.name);
                            $("#logoutDiv").show();
                            $("#historySqDiv").show();
                            $("#loginDiv").hide();
                            $("#registerDiv").hide();
                        } else {
                            alert(data.msg);
                        }
                    }
                );
            }
        }
    </script>
