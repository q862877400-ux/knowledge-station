	<script type="text/javascript">
		$(function() {
				var url = window.location.href;
				var	regionCode;
				if(url.split("?")[1]!=undefined){
					if(url.split("&")[1]!=undefined){
						regionCode = url.split("?")[1].split("&")[1].split("=")[1];
					}else{
						regionCode = url.split("?")[1].split("=")[1];
					}
					var replaceStr = "#";
					regionCode= regionCode.replace(new RegExp(replaceStr,'gm'),'');
				}else{
					regionCode="650000000000";
				}
				//首页进行相关配置
				var indexPage="";
				if(regionCode=="650000000000"){
					indexPage="/html/main/index.jsp?regionCode="+regionCode;
					//首页
					$("#firstPage").attr("href",indexPage);
				}else{
					//设置首页可配置
					var url="/letter/pre-accept-letter-info!queryStartPage.action?regionCode="+regionCode;
					$.ajax({
			                url: url,
			                contentType: "application/json; charset=utf-8",
			                dataType: "text",
			                success: function (result) {
			                   // alert(result);
			                    indexPage=result;
			                  //首页
			                    $("#firstPage").attr("href",indexPage);
			                },
			                error: function (err) {
			                    return false;
			                }
			            }
			            );
				}
				//信访指南
				$("#guide").attr("href","/html/petitionGuide/onlineOder.jsp?regionCode="+regionCode);
				//显示图片
				$("#image").attr("src","/html/images/"+regionCode+".jpg");
				//网上信访
				$("#online").attr("href","/html/petitionOnline/netRport.jsp?regionCode="+regionCode);
				
				//人民建议征集
			//	$("#peopleAdvice").attr("href","/html/peopleAdvice/peopleAdvice.jsp?regionCode="+regionCode);
				$("#peopleAdvice").attr("href","/html/login/login.jsp?regionCode="+regionCode);
				
				$("#noLogon").attr("href","/html/login/login.jsp?regionCode="+regionCode);
				//查询评价
				$("#queryEval").attr("href","/html/onlineInquiry/onlineILsit.jsp?regionCode="+regionCode);
				//未登录
				$("#pingLonNo").attr("href","/html/onlineInquiry/queryIndex.jsp?regionCode="+regionCode);
				
				//个人中心
				$("#grzx01").attr("href","/html/users/index.jsp?regionCode="+regionCode);
				$("#grzx02").attr("href","/html/login/login.jsp?regionCode="+regionCode);
		
		}
		)
	</script>
</head>
