        function customViewFormatter (data) {
            var template = $('#profileTemplate').html()
            var view = ''
            $.each(data, function (i, row) {
              view += template.replace('%name%', row.startName)
              .replace('%tid%', $.table.selectDictLabel(tidDatas, row.tid))
              .replace('%createTime%', row.createTime)
              .replace('%bjTime%', row.bjTime)
              .replace('%title%', row.title)
              .replace('%content%', row.content)
              .replace('%answerinfoTotal%', row.answerinfoTotal);
            })
            return `${view}`
          }
