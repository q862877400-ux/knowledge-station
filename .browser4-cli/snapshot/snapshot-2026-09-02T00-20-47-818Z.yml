        - generic "GB/T 21126-2007 小麦粉中甲醛次硫酸氢钠怎么测定" [ref=e18] [box=412,3,338,40]
        - generic [ref=e144] [box=57,55,673,919]:
          - paragraph [ref=e145] [box=71,66,643,897]:
            - text: 依据GB/T 21126-2007，小麦粉中甲醛次硫酸氢钠的测定采用高效液相色谱法，具体测定步骤如下：
            - LineBreak [ref=e146] [box=661,68,0,17]
            - LineBreak [ref=e147] [box=71,92,0,17]
            - text: "**1. 测定原理**"
            - LineBreak [ref=e148] [box=162,115,0,17]
            - text: 在酸性溶液中，样品中残留的甲醛次硫酸氢钠分解释放出的甲醛被水提取，提取后的甲醛与2,4-二硝基苯肼发生加成反应，生成黄色的2,4-二硝基苯腙，用正己烷萃取后，经高效液相色谱仪分离，与标准甲醛衍生物的保留时间对照定性，用标准曲线法定量。GB/T 21126-2007-3
            - LineBreak [ref=e149] [box=417,186,0,17]
            - LineBreak [ref=e150] [box=71,210,0,17]
            - text: "**2. 样品测定操作**"
            - LineBreak [ref=e151] [box=189,233,0,17]
            - text: 取2.0mL样品处理所得上清液于25mL比色管中，加入1mL磷酸氢二钠溶液、0.5mL衍生剂，补加水至10mL，盖上塞子，摇匀。然后置于50℃水浴中加热40min后取出，用流水冷却至室温，准确加入5.0mL正己烷，将比色管横置，水平方向轻轻振摇3次～5次后，将比色管倾斜放置，增加正己烷与水溶液的接触面积。在一个小时内，每隔5min轻轻振摇3次～5次，然后再静置30min，取10μL正己烷萃取液进样，并与标准曲线比较定量。注意振摇时不宜剧烈，以免发生乳化；如果出现乳化现象，滴加1滴～2滴无水乙醇。GB/T 21126-2007-6.4GB/T 21126-2007-6.3
            - LineBreak [ref=e152] [box=216,375,0,17]
            - LineBreak [ref=e153] [box=71,399,0,17]
            - text: "**3. 标准工作曲线绘制**"
            - LineBreak [ref=e154] [box=216,422,0,17]
            - text: 分别量取0.00mL、0.25mL、0.50mL、1.00mL、2.00mL、4.00mL甲醛标准使用液于25mL比色管中（相当于0、0.5、1.0、2.0、4.0、8.0μg甲醛），分别加入2mL盐酸-氯化钠溶液、1mL磷酸氢二钠溶液、0.5mL衍生剂，补加水至10mL，盖上塞子，摇匀。置于50℃水浴中加热40min后，取出用流水冷却至室温。准确加入5.0mL正己烷，按上述振摇、静置操作后，取10μL正己烷萃取液进样。以所取甲醛标准使用液中甲醛的质量（以微克为单位）为横坐标，甲醛衍生物苯腙的峰面积为纵坐标，绘制标准工作曲线。GB/T 21126-2007-6.3
            - LineBreak [ref=e155] [box=711,541,0,17]
            - LineBreak [ref=e156] [box=71,564,0,17]
            - text: "**4. 结果计算**"
            - LineBreak [ref=e157] [box=162,588,0,17]
            - text: 样品中甲醛次硫酸氢钠含量（以甲醛计）按式(1)计算，式中：c为样品中甲醛含量（μg/g）；m₁为按甲醛衍生物苯腙峰面积从标准工作曲线查得甲醛的质量（μg）；50为样品加提取液体积（mL）；2为测定用样品提取液体积（mL）；m为样品质量（g）。GB/T 21126-2007-7
            - LineBreak [ref=e158] [box=428,659,0,17]
            - LineBreak [ref=e159] [box=71,682,0,17]
            - text: "**5. 结果报告与精密度**"
            - LineBreak [ref=e160] [box=216,706,0,17]
            - text: "- 甲醛含量计算结果不超过10μg/g时，报告结果为未检出。GB/T 21126-2007-8"
            - LineBreak [ref=e161] [box=537,730,0,17]
            - text: "- 以双试验测定结果的算术平均值作为样品的甲醛含量，保留小数点后1位。在重复条件下获得的两次独立测定结果的绝对差值不得超过算术平均值的15%。GB/T 21126-2007-9"
            - LineBreak [ref=e162] [box=470,777,0,17]
            - LineBreak [ref=e163] [box=71,800,0,17]
            - text: "**6. 检出限**"
            - LineBreak [ref=e164] [box=148,824,0,17]
            - text: 本标准的检出限为0.08μg/g。GB/T 21126-2007-1
            - LineBreak [ref=e165] [box=363,848,0,17]
            - LineBreak [ref=e166] [box=71,871,0,17]
            - text: "**7. 试剂要求**"
            - LineBreak [ref=e167] [box=162,895,0,17]
            - text: 所用化学试剂中，正己烷为色谱纯，其余均为分析纯。配溶液所用水均为经高锰酸钾处理后的重蒸水。GB/T 21126-2007-4
