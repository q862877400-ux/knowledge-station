        - generic "我要高处作业，怎么判断级别" [ref=e4096] [box=546,109,203,40]
        - generic [ref=e4099] [box=57,161,673,919]:
          - paragraph [ref=e4100] [box=71,172,643,897]:
            - text: 根据您的问题，高处作业级别的判断需按以下步骤进行：
            - LineBreak [ref=e3709] [box=409,175,0,17]
            - LineBreak [ref=e3710] [box=71,198,0,17]
            - text: "**第一步：确定基础高度（hb）**"
            - LineBreak [ref=e3712] [box=279,222,0,17]
            - text: 以作业位置为中心，6米为半径划出的垂直于水平面的柱形空间内的最低处与作业位置间的高度差，即为基础高度GB 3608-2025-3.5。
            - LineBreak [ref=e3714] [box=219,269,0,17]
            - LineBreak [ref=e3715] [box=71,293,0,17]
            - text: "**第二步：确定可能坠落范围半径（R）**"
            - LineBreak [ref=e3717] [box=325,316,0,17]
            - text: 根据基础高度查表确定可能坠落范围半径GB 3608-2025-5.1：
            - LineBreak [ref=e3719] [box=435,340,0,17]
            - text: "- 2≤hb≤5时，R=3米；"
            - LineBreak [ref=e3721] [box=208,364,0,17]
            - text: "- 5<hb≤15时，R=4米；"
            - LineBreak [ref=e3723] [box=215,387,0,17]
            - text: "- 15<hb≤30时，R=5米；"
            - LineBreak [ref=e3725] [box=222,411,0,17]
            - text: "- hb>30时，R=6米GB 3608-2025-5.1。"
            - LineBreak [ref=e3727] [box=306,435,0,17]
            - LineBreak [ref=e3728] [box=71,458,0,17]
            - text: "**第三步：确定高处作业高度（hw）**"
            - LineBreak [ref=e3730] [box=308,482,0,17]
            - text: 作业区各作业位置至相应坠落高度基准面（即可能坠落范围内最低处的水平面）的垂直距离中的最大值，即为高处作业高度GB 3608-2025-3.6GB 3608-2025-3.2。
            - LineBreak [ref=e3732] [box=394,529,0,17]
            - LineBreak [ref=e3733] [box=71,553,0,17]
            - text: "**第四步：判断是否存在客观危险因素并分级**"
            - LineBreak [ref=e3735] [box=358,576,0,17]
            - text: "- 若不存在4.2条列出的任一种客观危险因素，按A类法分级；若存在一种或一种以上，则按B类法分级GB 3608-2025-4.3。"
            - LineBreak [ref=e3737] [box=171,623,0,17]
            - text: "- 分级表如下GB 3608-2025-4.3："
            - LineBreak [ref=e3739] [box=269,647,0,17]
            - text: "- **A类法**：2≤hw≤5为Ⅰ级；5<hw≤15为Ⅱ级；15<hw≤30为Ⅲ级；hw>30为Ⅳ级。"
            - LineBreak [ref=e3741] [box=590,671,0,17]
            - text: "- **B类法**：2≤hw≤5为Ⅱ级；5<hw≤15为Ⅲ级；15<hw≤30为Ⅳ级；hw>30为Ⅳ级。"
            - LineBreak [ref=e3743] [box=589,694,0,17]
            - LineBreak [ref=e3744] [box=71,718,0,17]
            - text: "**客观危险因素包括**（存在任一即按B类法）GB 3608-2025-4.2："
            - LineBreak [ref=e3746] [box=465,742,0,17]
            - text: a) 5级以上风力；
            - LineBreak [ref=e3748] [box=174,765,0,17]
            - text: b) Ⅱ级或Ⅱ级以上的高温作业；
            - LineBreak [ref=e3750] [box=263,789,0,17]
            - text: c) 作业时间段平均气温等于或低于5℃；
            - LineBreak [ref=e3752] [box=309,813,0,17]
            - text: d) 接触冷水温度等于或低于12℃；
            - LineBreak [ref=e3754] [box=277,836,0,17]
            - text: e) 作业场地有冰、雪、霜、水、油等易滑物；
            - LineBreak [ref=e3756] [box=343,860,0,17]
            - text: f) 照明低于作业场所一般照明照度标准值的10%，或低于15lx；
            - LineBreak [ref=e3758] [box=443,883,0,17]
            - text: g) 作业活动范围与危险电压带电体的距离小于表1规定（如≤10kV时小于1.7米等）；
            - LineBreak [ref=e3760] [box=569,907,0,17]
            - text: h) 摆动，或立足处不是平面或只有很小的平面（任一边小于500mm的矩形平面、直径小于500mm的圆形平面或类似尺寸）；
            - LineBreak [ref=e3762] [box=179,954,0,17]
            - text: i) Ⅲ级或Ⅲ级以上的体力劳动强度；
            - LineBreak [ref=e3764] [box=285,978,0,17]
            - text: j) 空气中含氧量低于19.5%或存在有毒气体。
            - LineBreak [ref=e3766] [box=334,1001,0,17]
            - LineBreak [ref=e3767] [box=71,1025,0,17]
            - text: 请补充说明您作业现场是否存在上述客观危险因素。
