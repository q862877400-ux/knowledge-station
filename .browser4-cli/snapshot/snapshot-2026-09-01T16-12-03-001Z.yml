    - generic "第 1 轮对话 🗑 清空对话 🗑 清空对话 我要安装一个气体探头，怎么确定高度 🤖 根据您的问题，气体探头安装高度的确定需依据被测气体的密度与释放源位置，具体如下： - 检测比空气重的可燃气体或有毒气体时，探测器的安装高度宜距地坪(或楼地板)0.3m～0.6m GB/T 50493-2019-6.1.2。 - 检测比空气轻的可燃气体或有毒气体时，探测器的安装高度宜在释放源上方2.0m内 GB/T 50493-2019-6.1.2。 - 检测比空气略重的可燃气体或有毒气体时，探测器的安装高度宜在释放源下方0.5m～1.0m GB/T 50493-2019-6.1.2。 - 检测比空气略轻的可燃气体或有毒气体时，探测器的安装高度宜高出释放源0.5m～1.0m GB/T 50493-2019-6.1.2。 同时，探测器探头应靠近释放源，且在气体、蒸气易于聚集的地点 GB/T 50493-2019-4.1.4。 请注意，上述条款中的“宜”为推荐性要求，非强制性。若您涉及受限空间内的气体检测，则需按GB 30871-2022执行，但该标准未规定探头安装高度，仅要求检测点应有代表性，容积较大的受限空间应对上、中、下（左、中、右）各部位进行检测分析 GB 30871-2022-6.3 b。 请补充说明您要检测的气体名称及其密度（比空气重、轻、略重或略轻），以便确定具体安装高度。 如：动火作业监护要求 如：动火作业监护要求 检索时包含已废止版本 检索时包含已废止版本 checkbox 含已废止 R9 追问档位 R9 追问档位 正本清源（追问） default 正本清源（追问） 打破沙锅 thorough 打破沙锅 差不多就行 quick 差不多就行 纯靠猜 guess 纯靠猜 回答覆盖范围（R59）：勾选后回答更全面（检索更多证据、回答更长）；不勾选为精简模式 回答覆盖范围（R59）：勾选后回答更全面（检索更多证据、回答更长）；不勾选为精简模式 checkbox 全面 提问 ⏎ 提问 ⏎" [ref=e3476] [box=0,54,768,997]:
