            - paragraph "5.1 近红外光谱仪:傅里叶变换近红外光谱仪,配置积分球固体采样模块(IntegratingSphereModule)或光纤分析模块(FiberOpticModule),扫描范围包括4000cm-1 10000cm-1,分辨率优于8cm-1。配置具有近红外光谱采集、存储、建模分析等功能的近红外光谱软件。" [ref=e2016] [box=1155,1213,747,44]: 近红外光谱仪:傅里叶变换近红外光谱仪,配置积分球固体采样模块(IntegratingSphereModule)或光纤分析模块(FiberOpticModule),扫描范围包括4000cm-1 10000cm-1,分辨率优于8cm-1。配置具有近红外光谱采集、存储、建模分析等功能的近红外光谱软件。
