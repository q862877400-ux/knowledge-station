          - generic "原件第 5 页" [ref=e2148] [box=1155,1398,747,68]:
            - generic "6" [ref=e2030] [box=1155,1398,747,22]
            - paragraph "6 样品选择选取目标产地具有代表性的珍珠粉和贝壳粉,收集珍珠粉和贝壳粉至少各50个样品(以70个 100个样品为宜),样品粒径宜小于10μm。" [ref=e2028] [box=1155,1422,747,44]: 样品选择选取目标产地具有代表性的珍珠粉和贝壳粉,收集珍珠粉和贝壳粉至少各50个样品(以70个 100个样品为宜),样品粒径宜小于10μm。
