          - generic "原件第 5 页" [ref=e2150] [box=1155,1544,747,96]:
            - generic "7.1" [ref=e2039] [box=1155,1544,747,22]
            - paragraph "7.1 近红外光谱测定将珍珠粉、贝壳粉和待测样品置于样品池中,使用积分球固体采样模块或光纤分析漫反射模块,扫描范围4000cm-1 10000cm-1,扫描次数不少于64次,采集珍珠粉、贝壳粉、待测样品近红外光谱。" [ref=e2036] [box=1155,1568,747,44]: 近红外光谱测定将珍珠粉、贝壳粉和待测样品置于样品池中,使用积分球固体采样模块或光纤分析漫反射模块,扫描范围4000cm-1 10000cm-1,扫描次数不少于64次,采集珍珠粉、贝壳粉、待测样品近红外光谱。
            - paragraph "2" [ref=e2038] [box=1155,1618,747,22]
          - generic "原件第 6 页" [ref=e2151] [box=1155,1656,747,46]:
            - generic "7.2" [ref=e2043] [box=1155,1656,747,22]
            - paragraph "7.2 定性分析模型" [ref=e2041] [box=1155,1681,747,22]: 定性分析模型
          - generic "原件第 6 页" [ref=e2152] [box=1155,1719,747,112]:
            - generic "7.2.1" [ref=e2047] [box=1155,1719,747,22]
            - paragraph "7.2.1 相似度匹配分析模型选择相似度匹配(SimilarityMatch)方法建立相似度匹配分析模型,光程类型选择标准正态变量变换(StandardNormalVariateTransformation,SNV)或多元散射校正(MultiplicativeScatter Correction,MSC),导入珍珠粉近红外光谱(7.1),光谱处理范围选择4100cm-1 7500cm-1,平滑滤噪选择二阶导数(SecondDerivate)、NorrisDerivativeFilter(5,5),设定相似度匹配度阈值(Match ValueThreshold)为90.00,相似度匹配值≥90.00,则为通过(Pass),相似度匹配值<90.00,则为不通过(Fail)。" [ref=e2045] [box=1155,1743,747,88]: 相似度匹配分析模型选择相似度匹配(SimilarityMatch)方法建立相似度匹配分析模型,光程类型选择标准正态变量变换(StandardNormalVariateTransformation,SNV)或多元散射校正(MultiplicativeScatter Correction,MSC),导入珍珠粉近红外光谱(7.1),光谱处理范围选择4100cm-1 7500cm-1,平滑滤噪选择二阶导数(SecondDerivate)、NorrisDerivativeFilter(5,5),设定相似度匹配度阈值(Match ValueThreshold)为90.00,相似度匹配值≥90.00,则为通过(Pass),相似度匹配值<90.00,则为不通过(Fail)。
          - generic "原件第 6 页" [ref=e2153] [box=1155,1847,747,46]:
            - generic "7.2.2" [ref=e2051] [box=1155,1847,747,22]
            - paragraph "7.2.2 判别分析模型" [ref=e2049] [box=1155,1871,747,22]: 判别分析模型
          - generic "原件第 6 页" [ref=e2154] [box=1155,1909,747,68]:
            - generic "7.2.2.1" [ref=e2055] [box=1155,1909,747,22]
            - paragraph "7.2.2.1 校正集和验证集运用KennardStone算法按7∶3的比例分别将珍珠粉近红外光谱(7.1)分为珍珠粉校正集和珍珠粉验证集,将贝壳粉近红外光谱(7.1)分为贝壳粉校正集和贝壳粉验证集。" [ref=e2053] [box=1155,1933,747,44]: 校正集和验证集运用KennardStone算法按7∶3的比例分别将珍珠粉近红外光谱(7.1)分为珍珠粉校正集和珍珠粉验证集,将贝壳粉近红外光谱(7.1)分为贝壳粉校正集和贝壳粉验证集。
          - generic "原件第 6 页" [ref=e2155] [box=1155,1994,747,134]:
            - generic "7.2.2.2" [ref=e2059] [box=1155,1994,747,22]
            - paragraph "7.2.2.2 判别分析模型选择判别分析(DiscriminantAnalysis)方法建立判别分析模型,“珍珠粉”和“贝壳粉”作为类别名,光程类型选择SNV或MSC,导入珍珠粉和贝壳粉近红外光谱(7.1),光谱处理范围选择4100cm-1 7500cm-1,平滑滤噪选择二阶导数(SecondDerivate)、NorrisDerivativeFilter(5,5),分析待测样品与珍珠粉校正集和贝壳粉校正集之间的马氏距离,若待测样品与珍珠粉校正集之间距离值较小,则判定待测样品为珍珠粉;若待测样品与贝壳粉校正集之间距离值较小,则判定待测样品为贝壳粉。以珍珠粉验证集和贝壳粉验证集验证判别分析模型准确性,实例参见A.3.2。" [ref=e2057] [box=1155,2018,747,110]: 判别分析模型选择判别分析(DiscriminantAnalysis)方法建立判别分析模型,“珍珠粉”和“贝壳粉”作为类别名,光程类型选择SNV或MSC,导入珍珠粉和贝壳粉近红外光谱(7.1),光谱处理范围选择4100cm-1 7500cm-1,平滑滤噪选择二阶导数(SecondDerivate)、NorrisDerivativeFilter(5,5),分析待测样品与珍珠粉校正集和贝壳粉校正集之间的马氏距离,若待测样品与珍珠粉校正集之间距离值较小,则判定待测样品为珍珠粉;若待测样品与贝壳粉校正集之间距离值较小,则判定待测样品为贝壳粉。以珍珠粉验证集和贝壳粉验证集验证判别分析模型准确性,实例参见A.3.2。
