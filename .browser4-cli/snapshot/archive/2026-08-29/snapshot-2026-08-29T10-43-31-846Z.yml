      - generic "动火作业如何分级？" [ref=e458] [box=600,109,149,40]
      - generic "依据 GB 30871-2022，固定动火区外的动火作业分为特级动火、一级动火和二级动火三个级别；遇节假日、公休日、夜间或其他特殊情况，动火作业应升级管理 GB 30871-2022-5.1.1。 - **一级动火作业**：在火灾爆炸危险场所进行的除特级动火作业以外的动火作业；管廊上的动火作业按一级动火作业管理 GB 30871-2022-5.1.3。 - **二级动火作业**：除特级动火作业和一级动火作业以外的动火作业。此外，生产装置或系统全部停车，装置经清洗、置换、分析合格并采取安全隔离措施后，根据其火灾、爆炸危险性大小，经危险化学品企业生产负责人或安全管理负责人批准，动火作业可按二级动火作业管理 GB 30871-2022-5.1.4。 依据不足：证据条款未给出“特级动火作业”的具体定义或判定条件，也未说明“火灾爆炸危险场所”的界定标准。请补充说明特级动火作业的判定条件或场所火灾危险性类别。" [ref=e500] [box=57,161,673,281]:
