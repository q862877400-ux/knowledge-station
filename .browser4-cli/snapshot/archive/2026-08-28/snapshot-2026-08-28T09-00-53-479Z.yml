          - generic "原件第 9 页" [ref=e4701] [box=1267,-817,635,200]:
            - generic "4.10" [ref=e4271] [box=1267,-817,635,22]
            - paragraph "4.10 作业期间应设监护人•监护人应由具有生产（作业）实践经验的人员担任，并经专项培训考试合格，佩戴明显标识,持培训合格证上岗。监护人的通用职责要求： a） 作业前检査安全作业票。安全作业票应与作业内容相符并在有效期内；核査安全作业票中各项安全措施已得到落实。 b） 确认相关作业人员持有效资格证书上岗。 c） 核査作业人员配备和使用的个体防护装备满足作业要求。 d） 对作业人员的行为和现场安全作业条件进行检査与监督，负责作业现场的安全协调与联系。 e） 当作业现场出现异常情况时应中止作业,并采取安全有效措施进行应急处置，当作业人员违章时，应及时制止违章，情节严重时，应收回安全作业票、中止作业。 f） 作业期间，监护人不应擅自离开作业现场且不应从事与监护无关的事。确需离开作业现场时，应收回安全作业票，中止作业。" [ref=e4270] [box=1267,-793,635,176]
