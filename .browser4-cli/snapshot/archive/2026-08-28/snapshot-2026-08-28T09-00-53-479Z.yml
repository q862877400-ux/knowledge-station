          - generic "原件第 11 页" [ref=e4717] [box=1267,669,635,68]:
            - generic "5.2.1" [ref=e4320] [box=1267,669,635,22]
            - paragraph "5.2.1 动火作业应有专人监护,作业前应清除动火现场及周围的易燃物品，或采取其他有效安全防火措施，并配备消防器材，满足作业现场应急需求。" [ref=e4319] [box=1267,693,635,44]
          - generic "原件第 11 页" [ref=e4718] [box=1267,753,635,90]:
            - generic "5.2.2" [ref=e4323] [box=1267,753,635,22]
            - paragraph "5.2.2 凡在盛有或盛装过助燃或易燃易爆危险化学品的设备、管道等生产、储存设施及本文件规定的火灾爆炸危险场所中生产设备上的动火作业，应将上述设备设施与生产系统彻底断开或隔离，不应以水封或仅关闭阀门代替盲板作为隔断措施。" [ref=e4322] [box=1267,777,635,66]
          - generic "原件第 11 页" [ref=e4719] [box=1267,859,635,68]:
            - generic "5.2.3" [ref=e4326] [box=1267,859,635,22]
            - paragraph "5.2.3 拆除管线进行动火作业时，应先査明其内部介质危险特性、工艺条件及其走向，并根据所要拆除 管线的情况制定安全防护措施。" [ref=e4325] [box=1267,883,635,44]
          - generic "原件第 11 页" [ref=e4720] [box=1267,944,635,90]:
            - generic "5.2.4" [ref=e4329] [box=1267,944,635,22]
            - paragraph "5.2.4 动火点周围或其下方如有可燃物、电缆桥架、孔洞、誉井、地沟、水封设施、污水井等，应检查分析 并釆取清理或封盖等措施；对于动火点周围 15 m 范围内有可能泄漏易燃、可燃物料的设备设施，应釆取隔离措施；对于受热分解可产生易燃易爆、有毒有害物质的场所,应进行风险分析并采取清理或封盖等防护措施。" [ref=e4328] [box=1267,968,635,66]
          - generic "原件第 11 页" [ref=e4721] [box=1267,1050,635,46]:
            - generic "5.2.5" [ref=e4332] [box=1267,1050,635,22]
            - paragraph "5.2.5 在有可燃物构件和使用可燃物做防腐内衬的设备内部进行动火作业时，应采取防火隔绝措施。" [ref=e4331] [box=1267,1074,635,22]
          - generic "原件第 11 页" [ref=e4722] [box=1267,1112,635,90]:
            - generic "5.2.6" [ref=e4335] [box=1267,1112,635,22]
            - paragraph "5.2.6 在作业过程中可能释放出易燃易爆、有毒有害物质的设备上或设备内部动火时，动火前应进行风险分析，并采取有效的防范措施,必要时应连续检测气体浓度，发现气体浓度超限报警时，应立即停止作业；在较长的物料管线上动火，动火前应在彻底隔绝区域内分段采样分析。" [ref=e4334] [box=1267,1136,635,66]
          - generic "原件第 11 页" [ref=e4723] [box=1267,1219,635,46]:
            - generic "5.2.7" [ref=e4338] [box=1267,1219,635,22]
            - paragraph "5.2.7 在生产、使用、储存氧气的设备上进行动火作业时，设备内氧含量不应超过 23.5%（体积分数）。" [ref=e4337] [box=1267,1243,635,22]
          - generic "原件第 11 页" [ref=e4724] [box=1267,1281,635,46]:
            - generic "5.2.8" [ref=e4341] [box=1267,1281,635,22]
            - paragraph "5.2.8 在油气罐区防火堤内进行动火作业时，不应同时进行切水、取样作业。" [ref=e4340] [box=1267,1305,635,22]
          - generic "原件第 11 页" [ref=e4725] [box=1267,1343,635,90]:
            - generic "5.2.9" [ref=e4344] [box=1267,1343,635,22]
            - paragraph "5.2.9 动火期间，距动火点 30 m 内不应排放可燃气体；距动火点 15 m 内不应排放可燃液体；在动火点 10 m范围内、动火点上方及下方不应同时进行可燃溶剂清洗或喷漆作业；在动火点 10 m 范围内不应进行可燃性粉尘清扫作业。" [ref=e4343] [box=1267,1367,635,66]
          - generic "原件第 11 页" [ref=e4726] [box=1267,1449,635,46]:
            - generic "5.2.10" [ref=e4347] [box=1267,1449,635,22]
            - paragraph "5.2.10 在厂内铁路沿线 25 m以内动火作业时，如遇装有危险化学品的火车通过或停留时，应立即停止作业。" [ref=e4346] [box=1267,1473,635,22]
          - generic "原件第 11 页" [ref=e4727] [box=1267,1512,635,46]:
            - generic "5.2.11" [ref=e4350] [box=1267,1512,635,22]
            - paragraph "5.2.11 特级动火作业应采集全过程作业影像，且作业现场使用的摄录设备应为防爆型。" [ref=e4349] [box=1267,1536,635,22]
          - generic "原件第 11 页" [ref=e4728] [box=1267,1574,635,68]:
            - generic "5.2.12" [ref=e4353] [box=1267,1574,635,22]
            - paragraph "5.2.12 使用电焊机作业时，电焊机与动火点的间距不应超过 10 m,不能满足要求时应将电焊机作为动火点进行管理。" [ref=e4352] [box=1267,1598,635,44]
          - generic "原件第 11 页" [ref=e4729] [box=1267,1658,635,68]:
            - generic "5.2.13" [ref=e4356] [box=1267,1658,635,22]
            - paragraph "5.2.13 使用气焊、气割动火作业时，乙炔瓶应直立放置，不应卧放使用；氧气瓶与乙炔瓶的间距不应小于 5 m，二者与动火点间距不应小于 10 m,并应采取防晒和防倾倒措施；乙炔瓶应安装防回火装置。" [ref=e4355] [box=1267,1682,635,44]
          - generic "原件第 11 页" [ref=e4730] [box=1267,1742,635,46]:
            - generic "5.2.14" [ref=e4359] [box=1267,1742,635,22]
            - paragraph "5.2.14 作业完毕后应清理现场，确认无残留火种后方可离开。" [ref=e4358] [box=1267,1766,635,22]
          - generic "原件第 11 页" [ref=e4731] [box=1267,1804,635,46]:
            - generic "5.2.15" [ref=e4362] [box=1267,1804,635,22]
            - paragraph "5.2.15 遇五级风以上（含五级风）天气,禁止露天动火作业；因生产确需动火.动火作业应升级管理。" [ref=e4361] [box=1267,1829,635,22]
          - generic "原件第 11 页" [ref=e4732] [box=1267,1867,635,46]:
            - generic "5.2.16" [ref=e4365] [box=1267,1867,635,22]
            - paragraph "5.2.16 涉及可燃性粉尘环境的动火作业应满足 GB 15577 要求。" [ref=e4364] [box=1267,1891,635,22]
          - generic "原件第 11 页" [ref=e4733] [box=1267,1929,635,46]:
            - generic "5.3" [ref=e4368] [box=1267,1929,635,22]
            - paragraph "5.3 动火分析及合格标准" [ref=e4367] [box=1267,1953,635,22]
          - generic "原件第 11 页" [ref=e4734] [box=1267,1991,635,156]:
            - generic "5.3.1" [ref=e4371] [box=1267,1991,635,22]
            - paragraph "5.3.1 动火作业前应进行气体分析，要求如下： a） 气体分析的检测点要有代表性，在较大的设备内动火，应对上、中、下（左、中、右）各部位进行检测分析； b） 在管道、储罐、塔器等设备外壁上动火，应在动火点 10 m 范围内进行气体分析，同时还应检测设备内气体含量；在设备及管道外环境动火，应在动火点 10 m 范围内进行气体分析； c） 气体分析取样时间与动火作业开始时间间隔不应超过 30 min； d） 特级、一级动火作业中断时间超过 30 min，二级动火作业中断时间超过 60 min，应重新进行气体分析；每日动火前均应进行气体分析；特级动火作业期间应连续进行监测。" [ref=e4370] [box=1267,2015,635,132]
  - contentinfo "⚙️ 本地知识库 · 云增强模式（LLM 仅接收问题与证据片段） 外发内容全程留痕 · 运维面板可回溯" [ref=e3849] [box=0,1052,1920,28]