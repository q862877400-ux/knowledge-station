    function ANP_keydown(e,btnId){
    	var kcode;
    	if(window.event){
    		kcode=e.keyCode;
    	}else if(e.which){
    		kcode=e.which;
    	}
    	var validKey=(kcode==8||kcode==46||kcode==37||kcode==39||(kcode>=48&&kcode<=57)||(kcode>=96&&kcode<=105));
    	if(!validKey){
    		if(kcode==13) document.getElementById(btnId).click();
    		if(e.preventDefault) e.preventDefault();
    		else{event.returnValue=false};
    	}
    }
    function gojumpPage(){
    	var pagesum = 0;
    	var inPageNo = $("#inPageNo").val()*1;
    	if(isNaN(inPageNo)){
    		$("#pageNum").val('1');
    	}else if(inPageNo>pagesum){
    		jumpPage2(pagesum);
    	}else if(inPageNo<1){
    		jumpPage2(1);
    	}else{
    		jumpPage2(inPageNo);
    	}
    }
    function jumpPage2(pageNo){
    	$("#pageNum").val(pageNo);
    	if($("#keys").val()=='请输入文件号、标题...'){
    		$("#keys").val("");
    	}
    	submitForm(pageNo);
    }
    
	function pagechange(){
   		var page=$("#pageNum").val();
   		if(null==page){
   			return;
   		}
   		jumpPage2(1);
   	}
