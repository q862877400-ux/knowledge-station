[project]
name = "knowledge-station"
version = "0.1.0"
description = "通用国标与法律法规本地 AI 知识工作站 - 后台引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "jieba>=0.42.1",
    "pymupdf>=1.24",
    "fastembed>=0.3",
    "sqlite-vec>=0.1.1",
    "openai>=1.12",
    "python-ulid>=2.6",
    "curl_cffi>=0.7",
    # ---- 2026-09-13 依赖声明修复（verifier 审计 + 主对话交叉核实）----
    # httpx：原在 dev extras，实际生产 3 文件 8 处使用（mineru_cloud/ccs_fetcher/update.channels）
    "httpx>=0.27",
    # requests/urllib3/bs4：knowledge/law_source 模块级裸 import（无 try 守卫），
    # 此前仅靠 mineru/fastembed 传递依赖偶然满足，干净环境重建会 ImportError
    "requests>=2.31",
    "urllib3>=2.0",
    "beautifulsoup4>=4.12",
    # python-docx：**输入侧**（ingestion/docx_adapter、docx_ingest、material_ingest、
    #   knowledge/law_source）+ **编辑往返工具** office_roundtrip 都用它 ⇒ **保留**。
    #   ⚠ 2026-09-19（EXECUTION-PLAN 第 4 步）撤掉的是"把 Word 当**交付物**输出"那条通路
    #   （report_export 的问答依据/审查报告、update/report 的更新检查报告 Word 版、
    #   research_report 的 .docx）——**不是**这个库本身（输入侧解析要它）。
    "python-docx>=1.0",
    # 更新检查结果 Excel 导出（report.py export_batch_report_xlsx）
    "openpyxl>=3.1",
    # 已删除：python-pptx（2026-09-19，EXECUTION-PLAN 第 4 步）——PPT 交付物被业主否决
    #   （docs/NOT-DOING.md 第 1 条），唯一的消费者 exports/slide_export.py 与
    #   /report/research/slides 端点一并拆除，全仓已 0 import ⇒ 按"0 import 就删依赖"删掉。
    #   曾显式声明的理由（pptx 只是传递依赖恰好满足，见 requests/bs4 那条教训）随之作废。
    # 已删除：python-multipart（全仓 0 import、120 端点无 multipart 表单，
    #   venv 中仅作为 mineru 传递依赖存在）
    # 知识库目录排序：业主 2026-09-21 要求"同级按拼音"（纯 Python、MIT、840KB；
    #   已实测装得上：0.55.0，走本地缓存无需联网）。一级目录另有**手定顺序**
    #   （`folder.sort`：标准 10 / 法律法规 20 / 公司制度 30 / 待分类 90），
    #   所以排序口径是"手定顺序优先、拼音兜底"，见 folder_store 的 list 函数。
    "pypinyin>=0.55",
]

[project.optional-dependencies]
# MinerU 深度解析: magic-pdf 已更名为 mineru (2.x)，模型结构与 API 均以 mineru 为准
# （传递带入 python-multipart/pypdf/bs4 等，无需重复声明）
parser = ["mineru>=2.0"]
# 图形重绘三件（figure_redraw.py，缺失时自动降级 PNG 截图）
vision = ["numpy>=1.26", "opencv-python>=4.8", "rapidocr-onnxruntime>=1.3"]
# 进程管理（parser_worker/deep_server，缺失时 psutil 调用降级）
proc = ["psutil>=5.9"]
# Word COM 往返（docx_adapter.py，word_com_available() 守卫，仅 Windows）
wincom = ["pywin32>=306; sys_platform == 'win32'"]
# dev：httpx 已上提 dependencies
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    # mypy 门禁 2026-09-13 真正建立（此前声明了但从未运行——已修）：
    # 非 strict 口径（check_untyped_defs 等，见 [tool.mypy]），`python -m mypy` 零错误
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "scripts*", "eval*", "plugin*", "var*", "docs*"]
# 注意：src/__init__.py 必须存在，否则 find_packages 返回空（2026-09-13 实测）

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── mypy 门禁（2026-09-13 立项；REQUIREMENTS 硬指标#2 的 Python 半）──
# 非 strict 起步口径（verifier 建议）：真实暴露类型错误但不阻塞迭代。
# strict 里程碑另立——当前 120 文件 78% 已带返回注解，缺注解面按 warn 只增不减消化。
[tool.mypy]
python_version = "3.12"
files = ["src"]
# 第三方无 stub（fitz/jieba/mineru 系）不归我们修——缺失即忽略
ignore_missing_imports = true
# 保守开关集：不做 strict 全家桶，只开低噪声高价值的
warn_unused_ignores = false          # 现存 7 处历史 # type:ignore 允许不精确
check_untyped_defs = true            # 未注解函数体内也做检查（比默认强）
warn_redundant_casts = true
no_implicit_optional = true         # 与现代 Python 语义对齐

