[project]
name = "knowledge-station"
version = "0.1.0"
description = "通用国标与法律法规本地 AI 知识工作站 - 后台引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "jieba>=0.42.1",
    "pymupdf>=1.24",
    "fastembed>=0.3",
    "sqlite-vec>=0.1.1",
    "openai>=1.12",
    "python-ulid>=2.6",
    "python-multipart>=0.0.9",
    "curl_cffi>=0.7",
    "python-docx>=1.0",   # F-05 更新检查报告 Word 导出（report.py）
    "openpyxl>=3.1",      # 更新检查结果 Excel 导出（report.py export_batch_report_xlsx）
]

[project.optional-dependencies]
# MinerU 深度解析: magic-pdf 已更名为 mineru (2.x)，模型结构与 API 均以 mineru 为准
parser = ["mineru>=2.0"]
dev = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
