<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 仿真 · KnowledgeStation 侧栏原型（黑白双配色 · 全假数据）</title>
<style>
/* ============================================================================
   配色 token：**照抄 DSH 自己的 design-platform.css**（不是我自己调的颜色）
   浅色 = body / 深色 = body[data-ds-dark-theme]，与宿主同构，浏览器里可直接切换。
   来源：packages/client/ui-theme/src/styles/design-platform.css
   ============================================================================ */
body{
  /* --- 静态色（浅色块） --- */
  --bluish-00:rgb(255,255,255); --bluish-50:rgb(249,250,251); --bluish-60:rgb(245,246,247);
  --bluish-75:rgb(241,243,245);  --bluish-100:rgb(235,238,242); --bluish-150:rgb(233,236,242);
  --bluish-200:rgb(225,229,238); --bluish-300:rgb(207,211,214); --bluish-400:rgb(173,178,184);
  --bluish-600:rgb(129,133,140); --bluish-700:rgb(97,102,107);  --bluish-1000:rgb(15,17,21);
  --green-100:rgb(230,250,237); --green-500:rgb(34,197,94);
  --amber-100:rgb(254,245,231); --amber-600:rgb(221,134,41);
  --red-50:rgb(254,242,242);    --red-600:rgb(236,19,19);
  --ds-blue-50:rgb(237,243,254); --ds-blue-100:rgb(228,237,253); --ds-blue-500:rgb(65,118,230);

  /* --- alias（浅色） --- */
  --dsw-alias-bg-base:var(--bluish-00);
  --dsw-alias-bg-layer-2:var(--bluish-00);
  --dsw-alias-bg-layer-3:var(--bluish-00);
  --dsw-alias-bg-module-platform:var(--bluish-60);
  --dsw-alias-bg-overlay:var(--bluish-150);
  --dsw-alias-bg-skeleton:rgba(0,0,0,.04);
  --dsw-alias-border-l1:rgba(0,0,0,.04);
  --dsw-alias-border-l2:rgba(0,0,0,.1);
  --dsw-alias-border-l3:rgba(0,0,0,.12);
  --dsw-alias-border-l4:rgba(0,0,0,.16);
  --dsw-alias-interactive-bg-hover:rgba(38,49,72,.06);
  --dsw-alias-interactive-bg-active:rgba(38,49,72,.1);
  --dsw-alias-interactive-bg-hover-solid:var(--bluish-75);
  --dsw-alias-label-primary:var(--bluish-1000);
  --dsw-alias-label-secondary:var(--bluish-700);
  --dsw-alias-label-tertiary:var(--bluish-600);
  --dsw-alias-label-caption:var(--bluish-400);
  --dsw-alias-markdown-tag:var(--bluish-75);
  --dsw-alias-markdown-citation:var(--bluish-100);
  --dsw-alias-brand-primary:var(--bluish-1000);
  --dsw-alias-link:var(--ds-blue-500);
  --dsw-alias-state-success-primary:var(--green-500);
  --dsw-alias-state-success-tertiary:var(--green-100);
  --dsw-alias-state-warn-primary:rgb(245,158,11);
  --dsw-alias-state-warn-label:var(--amber-600);
  --dsw-alias-state-warn-tertiary:var(--amber-100);
  --dsw-alias-state-error-primary:var(--red-600);
  --dsw-alias-state-error-tertiary:var(--red-50);
  --dsw-specific-sidebar-fill:var(--bluish-50);
  --dsw-specific-sidebar-nav-item-hover:var(--bluish-75);
  --dsw-specific-sidebar-nav-item-active:var(--bluish-100);
  --dsw-specific-input-major:var(--bluish-00);
  --dsw-specific-bubble:var(--ds-blue-50);
  --dsw-specific-menu:var(--bluish-00);
  --dsw-alias-toast-bg:rgb(53,54,56);
}
body[data-ds-dark-theme]{
  --bluish-50:rgb(249,250,251);  --bluish-300:rgb(207,211,214); --bluish-400:rgb(173,178,184);
  --bluish-600:rgb(129,133,140); --bluish-700:rgb(97,102,107);  --bluish-750:rgb(67,69,74);
  --bluish-800:rgb(53,54,56);    --bluish-850:rgb(44,44,46);    --bluish-875:rgb(35,35,36);
  --bluish-900:rgb(27,27,28);    --bluish-950:rgb(21,21,23);
  --dsw-alias-bg-base:var(--bluish-950);
  --dsw-alias-bg-layer-2:var(--bluish-850);
  --dsw-alias-bg-layer-3:var(--bluish-800);
  --dsw-alias-bg-module-platform:var(--bluish-800);
  --dsw-alias-bg-overlay:var(--bluish-700);
  --dsw-alias-bg-skeleton:rgba(255,255,255,.08);
  --dsw-alias-border-l1:rgba(255,255,255,.06);
  --dsw-alias-border-l2:rgba(255,255,255,.12);
  --dsw-alias-border-l3:rgba(255,255,255,.16);
  --dsw-alias-border-l4:rgba(255,255,255,.2);
  --dsw-alias-interactive-bg-hover:rgba(255,255,255,.08);
  --dsw-alias-interactive-bg-active:rgba(255,255,255,.14);
  --dsw-alias-interactive-bg-hover-solid:var(--bluish-800);
  --dsw-alias-label-primary:var(--bluish-50);
  --dsw-alias-label-secondary:var(--bluish-300);
  --dsw-alias-label-tertiary:var(--bluish-400);
  --dsw-alias-label-caption:var(--bluish-600);
  --dsw-alias-markdown-tag:var(--bluish-850);
  --dsw-alias-markdown-citation:var(--bluish-800);
  --dsw-alias-brand-primary:var(--bluish-50);
  --dsw-alias-link:rgb(103,158,254);
  --dsw-alias-state-success-tertiary:rgb(20,60,35);
  --dsw-alias-state-warn-tertiary:rgb(70,52,15);
  --dsw-alias-state-error-tertiary:rgb(70,25,25);
  --dsw-specific-sidebar-fill:var(--bluish-900);
  --dsw-specific-sidebar-nav-item-hover:var(--bluish-850);
  --dsw-specific-sidebar-nav-item-active:var(--bluish-750);
  --dsw-specific-input-major:var(--bluish-850);
  --dsw-specific-bubble:var(--bluish-850);
  --dsw-specific-menu:var(--bluish-800);
  --dsw-alias-toast-bg:var(--bluish-750);
}

/* ---------- 画布 ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--dsw-alias-bg-module-platform);color:var(--dsw-alias-label-primary);
  font:14px/1.55 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}

/* ---------- 原型自己的控制条（不属于 UI，明示） ---------- */
.harness{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;background:var(--dsw-alias-bg-base);border-bottom:1px solid var(--dsw-alias-border-l2);
  font-size:12px;color:var(--dsw-alias-label-secondary)
}
.harness b{color:var(--dsw-alias-label-primary)}
.hbtn{border:1px solid var(--dsw-alias-border-l4);border-radius:8px;padding:3px 10px;color:var(--dsw-alias-label-secondary)}
.hbtn:hover{background:var(--dsw-alias-interactive-bg-hover)}
.hbtn[aria-pressed="true"]{background:var(--dsw-alias-markdown-tag);color:var(--dsw-alias-label-primary);font-weight:600}
.hsep{width:1px;height:16px;background:var(--dsw-alias-border-l3)}

/* ============================================================================
   DSH 窗口：左=对话列（**整块不可点**） 右=右侧栏（可交互）
   几何照 ui-sidebar-right/SidebarRight.module.css：面板是页面的一列，
   bg = --dsw-alias-bg-base，左边框 0.5px --dsw-alias-border-l4。
   ============================================================================ */
.app{display:grid;grid-template-columns:1fr 452px;height:calc(100vh - 38px);min-height:560px}
@media (max-width:1000px){.app{grid-template-columns:1fr}.panel{display:none}}

.convo{display:flex;flex-direction:column;min-width:0;background:var(--dsw-alias-bg-base);
       pointer-events:none;user-select:none}          /* ← 左半边全部不能点 */
.convo-inner{flex:1;overflow:hidden;padding:22px 26px}
.msg{max-width:min(760px,86%);margin:0 auto 16px}
.msg .who{font-size:11px;color:var(--dsw-alias-label-caption);margin-bottom:5px}
.msg .body{padding:11px 14px;border-radius:12px;background:var(--dsw-specific-sidebar-fill);
           border:1px solid var(--dsw-alias-border-l1);line-height:1.7}
.msg.me .body{background:var(--dsw-specific-bubble);border-color:transparent}
.cite{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dsw-alias-link);
      background:var(--dsw-alias-markdown-citation);border-radius:6px;padding:2px 7px;margin:5px 4px 0 0}
.composer{margin:0 22px 18px;border:1px solid var(--dsw-alias-border-l3);border-radius:14px;
          background:var(--dsw-specific-input-major);padding:11px 13px}
.composer .ph{color:var(--dsw-alias-label-caption)}
.composer .caps{display:flex;gap:7px;margin-top:11px;align-items:center;flex-wrap:wrap}
/* 输入框里的作用域胶囊（真实存在的能力，见 KsScopeChip.tsx） */
.scope{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;
       padding:3px 10px;background:var(--dsw-alias-state-warn-tertiary);
       color:var(--dsw-alias-state-warn-label);border:1px solid var(--dsw-alias-border-l2)}
.scope .x{color:var(--dsw-alias-label-caption)}
.toolpill{font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--dsw-alias-border-l3);
          color:var(--dsw-alias-label-secondary)}

/* ---------- 右侧栏 ---------- */
.panel{display:flex;flex-direction:column;min-width:0;background:var(--dsw-alias-bg-base);
       border-left:.5px solid var(--dsw-alias-border-l4)}
/* .tabStrip / .tab 数值逐条照抄 dockkit.module.css:156-275 */
.tabStrip{display:flex;flex:none;gap:4px;align-items:center;height:28px;padding:10px 6px 0 10px}
.stripTabs{display:flex;flex:0 1 auto;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.stripTabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;flex:0 1 auto;align-items:center;min-width:80px;max-width:170px;
     height:28px;padding:0 10px;color:var(--dsw-alias-label-secondary);font-size:13px;line-height:1;
     white-space:nowrap;border-radius:12px;user-select:none}
.tab:hover{background:var(--dsw-alias-interactive-bg-hover)}
.tabActive{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-markdown-tag)}  /* 活动=实心胶囊 */
.tabTitle{display:flex;flex:1 1 auto;gap:5px;align-items:center;min-width:0;overflow:hidden;line-height:1.4}
.stripFill{flex:1 1 0;min-width:0}
.stripChrome{display:flex;flex:none;gap:8px}
/* 28px 圆按钮，15px 字形（SidebarRight.module.css:65-88） */
.iconButton{display:inline-flex;flex:none;align-items:center;justify-content:center;width:28px;height:28px;
            color:var(--dsw-alias-label-secondary);line-height:1;border-radius:28px;font-size:15px}
.iconButton:hover{background:var(--dsw-alias-interactive-bg-hover)}

.panelBody{flex:1 1 auto;min-height:0;overflow:auto;padding:12px 12px 56px}

/* ---------- 通用小件 ---------- */
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--dsw-alias-label-tertiary)}
.sec{font-size:12px;color:var(--dsw-alias-label-tertiary);margin:4px 0 7px;display:flex;align-items:center;gap:7px}
.btn{border:1px solid var(--dsw-alias-border-l4);border-radius:8px;padding:5px 11px;
     color:var(--dsw-alias-label-secondary);background:transparent}
.btn:hover{background:var(--dsw-alias-interactive-bg-hover)}
.btn.primary{background:var(--dsw-alias-brand-primary);color:var(--dsw-alias-bg-base);border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.88}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.search{width:100%;border:1px solid var(--dsw-alias-border-l3);border-radius:9px;padding:6px 10px;
        outline:none;background:var(--dsw-alias-bg-base)}
.search:focus{border-color:var(--dsw-alias-link)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--dsw-alias-border-l3);
      border-radius:999px;padding:3px 10px;font-size:12px;color:var(--dsw-alias-label-secondary)}
.chip:hover{background:var(--dsw-alias-interactive-bg-hover)}
.chip[aria-pressed="true"]{background:var(--dsw-alias-markdown-tag);color:var(--dsw-alias-label-primary);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600}
.b-ok{color:var(--dsw-alias-state-success-primary);background:var(--dsw-alias-state-success-tertiary)}
.b-warn{color:var(--dsw-alias-state-warn-label);background:var(--dsw-alias-state-warn-tertiary)}
.b-bad{color:var(--dsw-alias-state-error-primary);background:var(--dsw-alias-state-error-tertiary)}
.b-rep{color:var(--dsw-alias-label-secondary);background:var(--dsw-alias-markdown-tag)}
.b-unk{color:var(--dsw-alias-label-tertiary);background:var(--dsw-alias-markdown-tag)}
.b-mut{color:var(--dsw-alias-label-tertiary);background:var(--dsw-alias-markdown-tag)}
.b-tag{color:var(--dsw-alias-link);background:var(--dsw-alias-markdown-citation)}
.card{border:1px solid var(--dsw-alias-border-l2);border-radius:10px;padding:10px 11px;background:var(--dsw-alias-bg-base)}
.card:hover{border-color:var(--dsw-alias-border-l4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.crumb{font-size:12px;color:var(--dsw-alias-label-tertiary);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.crumb b{color:var(--dsw-alias-label-primary)}
.crumb .lnk{color:var(--dsw-alias-link)}
.empty{text-align:center;color:var(--dsw-alias-label-tertiary);padding:30px 10px;font-size:13px}
.note{font-size:12px;color:var(--dsw-alias-label-secondary);background:var(--dsw-alias-bg-module-platform);
      border:1px solid var(--dsw-alias-border-l2);border-radius:9px;padding:9px 11px;margin-top:12px}
.note b{color:var(--dsw-alias-label-primary)}

/* ---------- 目录树 ---------- */
.tline{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;cursor:pointer}
.tline:hover{background:var(--dsw-alias-interactive-bg-hover)}
.tline .tw{width:13px;text-align:center;color:var(--dsw-alias-label-caption);font-size:10px;flex:none}
.tline .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tline .tc{font-size:11px;color:var(--dsw-alias-label-caption)}

/* ---------- 文档行 ---------- */
.doc{display:flex;gap:9px;padding:8px 9px;border:1px solid var(--dsw-alias-border-l2);border-radius:9px;margin-bottom:6px}
.doc:hover{border-color:var(--dsw-alias-border-l4)}
.doc.sel{border-color:var(--dsw-alias-link);background:var(--dsw-alias-markdown-citation)}
.cbx{flex:none;width:15px;height:15px;margin-top:2px;accent-color:var(--dsw-alias-brand-primary);cursor:pointer}
.doc .main{flex:1;min-width:0}
.doc .l1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.doc .no{font-weight:700;font-size:13px}
.doc .nm{font-size:13px}
.doc .l2{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.doc .dates{font-size:11px;color:var(--dsw-alias-label-caption);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.doc .path{font-size:11px;color:var(--dsw-alias-label-caption);margin-top:3px}
.addtag{font-size:11px;color:var(--dsw-alias-label-tertiary);border:1px dashed var(--dsw-alias-border-l3);
        border-radius:999px;padding:1px 7px;flex:none}
.addtag:hover{color:var(--dsw-alias-label-primary);border-color:var(--dsw-alias-border-l4)}

/* ---------- 悬浮批量条 ---------- */
/* 相对 .panel 定位（.panelBody 是 static，所以它的 overflow 不会裁到这里） */
.bulk{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:9px 12px;display:flex;align-items:center;gap:9px;
      flex-wrap:wrap;background:var(--dsw-alias-toast-bg);color:#fff;border-top:1px solid var(--dsw-alias-border-l2)}
.bulk .b{border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:4px 10px;font-size:12px;color:#fff}
.bulk .b:hover{background:rgba(255,255,255,.14)}
.bulk .n{font-weight:700;font-size:12px}

/* ---------- 弹层 ---------- */
.pop{border:1px solid var(--dsw-alias-border-l3);border-radius:10px;background:var(--dsw-specific-menu);
     box-shadow:0 8px 26px rgba(0,0,0,.16);padding:10px;margin:8px 0}
.pop .pt{font-size:12px;color:var(--dsw-alias-label-tertiary);margin:6px 0 4px}
.menu{position:absolute;z-index:50;right:8px;top:44px;min-width:196px;background:var(--dsw-specific-menu);
      border:1px solid var(--dsw-alias-border-l3);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.18);padding:5px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;
             border-radius:7px;color:var(--dsw-alias-label-secondary);font-size:13px}
.menu button:hover{background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}
.menu .mi-k{margin-left:auto;font-size:11px;color:var(--dsw-alias-label-caption)}
.menu .div{height:1px;background:var(--dsw-alias-border-l2);margin:5px 4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--dsw-alias-toast-bg);
       color:#fff;font-size:13px;padding:9px 15px;border-radius:9px;z-index:99}
</style>
</head>
<body>

<!-- 原型自己的控制条（不是 UI 的一部分） -->
<div class="harness">
  <b>DSH 仿真原型</b>
  <span>左半区为静态演示（不可点）· 右侧栏可交互 · 数据全为占位</span>
  <span class="hsep"></span>
  <button class="hbtn" id="themeBtn">🌙 切到深色</button>
  <span class="hsep"></span>
  <span>侧栏三胶囊：</span>
  <button class="hbtn" data-tab="kb" aria-pressed="true">知识库</button>
  <button class="hbtn" data-tab="tags">标签</button>
  <button class="hbtn" data-tab="text">正文</button>
</div>

<div class="app">
  <!-- ================= 左：对话列（整块 pointer-events:none） ================= -->
  <div class="convo">
    <div class="convo-inner">
      <div class="msg">
        <div class="who">你</div>
        <div class="body">液氨储罐区的动火作业，间距和气体检测要求是什么？</div>
      </div>
      <div class="msg me">
        <div class="who">KnowledgeStation</div>
        <div class="body">
          按 GB 30871-2022《危险化学品企业特殊作业安全规范》第 <b>5.2</b> 条，动火作业分为特级、一级、二级；
          动火点周围 <b>15 m</b> 内应进行可燃气体检测，检测合格后方可作业。<br>
          <span class="cite">📄 GB 30871-2022 · 5.2 · 第 7 页</span>
          <span class="cite">📄 危险化学品安全管理条例 · 第二十四条</span>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="ph">给 KnowledgeStation 发消息…</div>
      <div class="caps" id="composerCaps">
        <span class="toolpill">🔍 查法规</span>
        <span class="scope" id="scopeChip"></span>
        <span class="toolpill" style="margin-left:auto">深度思考 ▾</span>
      </div>
    </div>
  </div>

  <!-- ================= 右：右侧栏（可交互） ================= -->
  <div class="panel" style="position:relative">
    <div class="tabStrip">
      <div class="stripTabs" id="stripTabs">
        <button class="tab tabActive" data-tab="kb"><span class="tabTitle">知识库</span></button>
        <button class="tab" data-tab="tags"><span class="tabTitle">标签</span></button>
        <button class="tab" data-tab="text"><span class="tabTitle">正文</span></button>
      </div>
      <div class="stripFill"></div>
      <div class="stripChrome">
        <button class="iconButton" id="caret" title="二级目录">▾</button>
        <button class="iconButton" title="全屏">⤢</button>
      </div>
    </div>
    <div class="panelBody" id="pane"></div>
  </div>
</div>

<script>
/* ==========================================================================
   数据：全部占位。标准号是真的，元数据/日期/正文摘录都是我编的。
   ========================================================================== */
const ST = {
  current:{t:'现行有效',c:'b-ok',i:'🟢'},
  upcoming:{t:'即将实施',c:'b-warn',i:'🟡'},
  withdrawn:{t:'已废止',c:'b-bad',i:'🔴'},
  superseded:{t:'被替代',c:'b-rep',i:'🔴'},
};
const LIBS = {
  std:{name:'标准', full:'国家标准·行业标准·团体标准'},
  law:{name:'法律法规', full:'法律法规'},
};

/* ---------- 检索：+ 与 - 语法（原型里是本地假实现） ---------- */
function parseQuery(raw){
  // '安全+半导体-冶金' → {pos:['安全','半导体'], neg:['冶金']}
  // ⚠ '-' 后紧跟数字时**不当运算符**（保护 GB 30871-2022 这类标准号）
  const pos=[],neg=[]; let cur='',sign='+';
  for(let i=0;i<raw.length;i++){
    const ch=raw[i];
    if((ch==='+'||ch==='-') && !(ch==='-' && /\d/.test(raw[i+1]||''))){
      const t=cur.trim(); if(t)(sign==='-'?neg:pos).push(t);
      sign=ch; cur=''; continue;
    }
    cur+=ch;
  }
  const t=cur.trim(); if(t)(sign==='-'?neg:pos).push(t);
  return {pos,neg};
}
function matchQuery(d){
  const q=S.q.trim(); if(!q) return true;
  const hay = S.content ? d.body : ([d.no,d.name].join(' '));
  const {pos,neg}=parseQuery(q);
  for(const p of pos) if(!hay.includes(p)) return false;
  for(const n of neg) if(hay.includes(n)) return false;
  return true;
}
function pass(d){
  if(S.lib && d.lib!==S.lib) return false;
  if(!matchQuery(d)) return false;
  if(S.f.st.size && !S.f.st.has(d.st)) return false;
  if(S.f.ty.size && (!d.ty || !S.f.ty.has(d.ty))) return false;
  if(S.f.tags.size && ![...S.f.tags].every(t=>d.tags.includes(t))) return false;
  return true;
}
const shown = ()=>DOCS.filter(pass);

/* 组树 + 空枝剪掉（与真实实现 KsFilesTab 那段管线同构） */
function buildTree(docs){
  const root={};
  for(const d of docs){
    let c=root;
    for(const seg of d.path){ c.ch=c.ch||{}; c.ch[seg]=c.ch[seg]||{name:seg,ch:{},docs:[]}; c=c.ch[seg]; }
    c.docs.push(d);
  }
  const prune=n=>{
    const kids=Object.values(n.ch||{}).map(prune).filter(Boolean);
    const docs=n.docs||[];
    if(!kids.length&&!docs.length) return null;
    return {name:n.name,ch:kids,docs};
  };
  return Object.values(root.ch||{}).map(prune).filter(Boolean);
}
const count=n=>(n.docs?n.docs.length:0)+(n.ch||[]).reduce((a,c)=>a+count(c),0);

/* ---------- 渲染件 ---------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stBadge=d=>`<span class="badge ${ST[d.st].c}">${ST[d.st].i} ${ST[d.st].t}</span>`;
const tyBadge=d=>d.ty?`<span class="badge ${d.ty==='mandatory'?'b-bad':'b-tag'}">${d.ty==='mandatory'?'强制性':'推荐性'}</span>`:'';
const tagBadge=t=>`<span class="badge b-tag">🏷 ${esc(t)}</span>`;

function treeHtml(nodes){
  let h='';
  for(const n of nodes){
    const open=S.open.has(n.name), kids=(n.ch||[]).length>0;
    h+=`<div><div class="tline" data-open-node="${esc(n.name)}">
      <span class="tw">${kids?(open?'▾':'▸'):'·'}</span>
      <span class="tn" title="${esc(n.name)}">${esc(n.name)}</span>
      <span class="tc">${count(n)}</span></div>`;
    if(open){
      if(kids) h+=`<div style="margin-left:11px">${treeHtml(n.ch)}</div>`;
      h+=n.docs.map(docRow).join('');
    }
    h+='</div>';
  }
  return h;
}

    <b>5.2 动火作业分级</b><br>
    动火作业分为特级动火作业、一级动火作业和二级动火作业……<br>
    <span style="background:var(--dsw-alias-state-warn-tertiary);padding:0 3px;border-radius:3px">动火点周围 15 m 内</span>
    应进行可燃气体检测……
  </div>
  <div class="note">这一格是原来的「正文」模式，保持现状。原来的「收藏」已改成「标签」。</div>`;
}

/* ---------- 主渲染 ---------- */
const pane=document.getElementById('pane');
function render(){
  pane.innerHTML = S.tab==='kb'?viewKb() : S.tab==='tags'?viewTags() : viewText();

  // 胶囊选中态 + 控制条同步
  document.querySelectorAll('#stripTabs .tab').forEach(t=>{
    t.className='tab'+(t.dataset.tab===S.tab?' tabActive':'');
  });
  document.querySelectorAll('.harness [data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===S.tab));

  // ▾ 二级目录
  const old=document.querySelector('.menu'); if(old) old.remove();
  if(S.menu){
    const m=document.createElement('div'); m.className='menu';
    m.innerHTML=`<button data-nav="kb-list">🗂 知识库管理</button>
      <button data-nav="kb-detail">📖 打开「标准」</button>
      <button>📥 文件导入</button>
      <button>📊 效力报告</button>
      <div class="div"></div><button>🧩 能力页<span class="mi-k">另一整页</span></button>
      <button>🔌 渠道台账<span class="mi-k">运维</span></button>`;
    document.querySelector('.panel').appendChild(m);
  }

  // 输入框里的作用域胶囊（左边不可点，但右侧操作会让它变）
  document.getElementById('scopeChip').innerHTML = S.scope
    ? `🏷 ${esc(S.scope)} · 仅在此标签内提问 <span class="x">✕</span>`
    : `<span class="x">未限定范围（全库检索）</span>`;

  // toast
  const t0=document.querySelector('.toast'); if(t0) t0.remove();
  if(S.toast){
    const t=document.createElement('div'); t.className='toast'; t.textContent=S.toast;
    document.body.appendChild(t);
    setTimeout(()=>{ S.toast=''; const x=document.querySelector('.toast'); if(x) x.remove(); },1900);
  }
}

/* ---------- 事件 ---------- */
function flash(msg){ S.toast=msg; render(); }

document.addEventListener('click',e=>{
  const t=e.target;

  const tb=t.closest('[data-tab]'); if(tb){ S.tab=tb.dataset.tab; if(S.tab!=='kb') S.lib=null; render(); return; }

  if(t.closest('#caret')){ S.menu=!S.menu; render(); return; }
  const nav=t.closest('[data-nav]');
  if(nav){ S.menu=false; S.tab='kb'; S.lib = nav.dataset.nav==='kb-detail'?'std':null; render(); return; }

  const ol=t.closest('[data-openlib]'); if(ol){ S.lib=ol.dataset.openlib; S.sel.clear(); render(); return; }
  if(t.closest('[data-back]')){ S.lib=null; render(); return; }

  const on=t.closest('[data-open-node]');
  if(on){ const k=on.dataset.openNode; S.open.has(k)?S.open.delete(k):S.open.add(k); render(); return; }

  const fst=t.closest('[data-fst]'); if(fst){ const k=fst.dataset.fst; S.f.st.has(k)?S.f.st.delete(k):S.f.st.add(k); render(); return; }
  const fty=t.closest('[data-fty]'); if(fty){ const k=fty.dataset.fty; S.f.ty.has(k)?S.f.ty.delete(k):S.f.ty.add(k); render(); return; }
  const ftg=t.closest('[data-ftag]'); if(ftg){ const k=ftg.dataset.ftag; S.f.tags.has(k)?S.f.tags.delete(k):S.f.tags.add(k); render(); return; }
  if(t.closest('[data-clearall]')){ S.f.st.clear();S.f.ty.clear();S.f.tags.clear();S.q=''; render(); return; }

  if(t.closest('[data-content]')){ S.content=!S.content; render(); return; }
  const md=t.closest('[data-mode]'); if(md){ S.mode=md.dataset.mode; render(); return; }

  const pk=t.closest('[data-pick]');
  if(pk){ const id=pk.dataset.pick; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); render(); return; }
  if(t.id==='selAll'){
    const ids=shown().map(d=>d.id);
    const all=ids.length&&ids.every(i=>S.sel.has(i));
    ids.forEach(i=>all?S.sel.delete(i):S.sel.add(i));
    render(); return;
  }
  if(t.closest('[data-clearsel]')){ S.sel.clear(); render(); return; }

  const bl=t.closest('[data-bulk]');
  if(bl){
    const n=S.sel.size, k=bl.dataset.bulk;
    const msg = k==='tag' ? `（原型）给 ${n} 项打标签…`
              : k==='move'? `（原型）把 ${n} 项移动到目录…`
              : `（原型）删除 ${n} 项（真实现要二次确认）`;
    flash(msg); return;
  }

  const at=t.closest('[data-addtag]'); if(at){ S.tagFor=S.tagFor===at.dataset.addtag?null:at.dataset.addtag; render(); return; }
  if(t.closest('[data-closetag]')){ S.tagFor=null; render(); return; }
  const tt=t.closest('[data-toggletag]');
  if(tt){
    const [id,name]=tt.dataset.toggletag.split('|');
    const d=DOCS.find(x=>x.id===id);
    d.tags.includes(name)?d.tags=d.tags.filter(x=>x!==name):d.tags.push(name);
    render(); return;
  }

  const sc=t.closest('[data-scope]');
  if(sc){ S.scope = S.scope===sc.dataset.scope?null:sc.dataset.scope; render(); return; }

  if(S.menu && !t.closest('.menu') && !t.closest('#caret')){ S.menu=false; render(); }
});

document.addEventListener('input',e=>{
  if(e.target.id==='q'){
    const pos=e.target.selectionStart;
    S.q=e.target.value; render();
    const el=document.getElementById('q');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos) }catch(_){} }
  }
});

/* ---------- 主题切换（浅色 / 深色，token 与宿主同名） ---------- */
document.getElementById('themeBtn').addEventListener('click',e=>{
  const dark=document.body.hasAttribute('data-ds-dark-theme');
  if(dark) document.body.removeAttribute('data-ds-dark-theme');
  else document.body.setAttribute('data-ds-dark-theme','');
  e.target.textContent = dark ? '🌙 切到深色' : '☀️ 切到浅色';
});

render();
</script>
</body>
</html>
